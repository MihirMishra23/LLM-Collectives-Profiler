# NOTE: this toml config is a preset for 64 A100 GPUs.

[job]
dump_folder = "./outputs"
description = "Llama 3 8B training NCCLX"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace_ncclx"
profile_freq = 1

[metrics]
log_freq = 10
enable_tensorboard = true
save_tb_folder = "tb_ncclx"

[model]
name = "llama3"
flavor = "8B"
hf_assets_path = "./assets/hf/Llama-3.1-8B"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 11

[training]
local_batch_size = 1
seq_len = 4096
max_norm = 1.0
steps = 11
dataset = "c4"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 4
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false

[compile]
enable=false

[activation_checkpoint]
mode = "full"

[validation]
enable = false
